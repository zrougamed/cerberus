name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:


permissions:
  contents: read

# Pinned tool versions; bump after reading the release notes.
env:
  STATICCHECK_VERSION: v0.8.2   # 2026.2.2
  GOVULNCHECK_VERSION: v1.9.0
  GOSEC_VERSION: v2.30.0

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Build Tests - Verify compilation across multiple distributions
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  
  build-ubuntu-2204:
    name: Build - Ubuntu 22.04
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build CI image
        run: |
          docker build --build-arg BASE_IMAGE=ubuntu:22.04 \
            -t cerberus-ci-ubuntu22 \
            -f .ci/Dockerfile .

      - name: Run build test
        run: |
          chmod +x .ci/build.sh
          docker run --rm -v $(pwd):/workspace \
            cerberus-ci-ubuntu22 /workspace/.ci/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cerberus-ubuntu-22.04
          path: |
            build/cerberus
            build/cerberus_tc.o
          retention-days: 7

  build-ubuntu-2404:
    name: Build - Ubuntu 24.04
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build CI image
        run: |
          docker build --build-arg BASE_IMAGE=ubuntu:24.04 \
            -t cerberus-ci-ubuntu24 \
            -f .ci/Dockerfile .

      - name: Run build test
        run: |
          chmod +x .ci/build.sh
          docker run --rm -v $(pwd):/workspace \
            cerberus-ci-ubuntu24 /workspace/.ci/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cerberus-ubuntu-24.04
          path: |
            build/cerberus
            build/cerberus_tc.o
          retention-days: 7

  build-debian:
    name: Build - Debian 12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build CI image
        run: |
          docker build --build-arg BASE_IMAGE=debian:12 \
            -t cerberus-ci-debian \
            -f .ci/Dockerfile .

      - name: Run build test
        run: |
          chmod +x .ci/build.sh
          docker run --rm -v $(pwd):/workspace \
            cerberus-ci-debian /workspace/.ci/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cerberus-debian-12
          path: |
            build/cerberus
            build/cerberus_tc.o
          retention-days: 7

  build-arch:
    name: Build - Arch Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build CI image
        run: |
          docker build --build-arg BASE_IMAGE=archlinux:latest \
            -t cerberus-ci-arch \
            -f .ci/Dockerfile .

      - name: Run build test
        run: |
          chmod +x .ci/build.sh
          docker run --rm -v $(pwd):/workspace \
            cerberus-ci-arch /workspace/.ci/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cerberus-arch-linux
          path: |
            build/cerberus
            build/cerberus_tc.o
          retention-days: 7

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Code Quality Checks
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  lint:
    name: Lint & Format Check
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || fromJSON(vars.GH_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run go mod verify
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run: gofmt -s -w ."
            gofmt -s -l .
            exit 1
          fi

      - name: Run staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Unit tests (race detector + coverage). Runs on the local runner when
  # GH_RUNS_ON points at it; no Docker or privileges needed.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  test:
    name: Unit Tests
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || fromJSON(vars.GH_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 -covermode=atomic -coverprofile=cover.out ./...

      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Security Scanning
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  security:
    name: Security Scan
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || fromJSON(vars.GH_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Installed as a binary rather than the gosec action: the action is a
      # container action and the local runner has no Docker daemon.
      - name: Run gosec
        run: go run "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" -no-fail -fmt sarif -out results.sarif ./...

      - name: Run govulncheck (fails on reachable vulnerabilities)
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Docker Build Test
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production Docker image
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker build \
            --build-arg COMMIT="${COMMIT}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            -t cerberus:test .

      - name: Verify image
        run: |
          docker images cerberus:test
          docker inspect cerberus:test | jq '.[0].Size'

      - name: Test image structure
        run: |
          docker run --rm cerberus:test ls -lh /app/

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Summary
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  summary:
    name: CI Summary
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || fromJSON(vars.GH_RUNS_ON || '"ubuntu-latest"') }}
    needs:
      - test
      - build-ubuntu-2204
      - build-ubuntu-2404
      - build-debian
      - build-arch
      - lint
      - security
      - docker
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  CI Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Build Tests:"
          echo "  Ubuntu 22.04: ${{ needs.build-ubuntu-2204.result }}"
          echo "  Ubuntu 24.04: ${{ needs.build-ubuntu-2404.result }}"
          echo "  Debian 12:    ${{ needs.build-debian.result }}"
          echo "  Arch Linux:   ${{ needs.build-arch.result }}"
          echo ""
          echo "Quality Checks:"
          echo "  Tests:        ${{ needs.test.result }}"
          echo "  Lint:         ${{ needs.lint.result }}"
          echo "  Security:     ${{ needs.security.result }}"
          echo "  Docker:       ${{ needs.docker.result }}"
          echo ""

      - name: Fail if any job failed
        if: |
          needs.test.result == 'failure' ||
          needs.build-ubuntu-2204.result == 'failure' ||
          needs.build-ubuntu-2404.result == 'failure' ||
          needs.build-debian.result == 'failure' ||
          needs.build-arch.result == 'failure' ||
          needs.lint.result == 'failure' ||
          needs.security.result == 'failure' ||
          needs.docker.result == 'failure'
        run: |
          echo "One or more CI jobs failed"
          exit 1

      - name: Success
        if: success()
        run: |
          echo "All CI checks passed!"