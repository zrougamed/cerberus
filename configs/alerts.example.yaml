# Full schema reference — values match built-in defaults.
# Copy and edit, or start from a more specific example in this directory.
#
#   cp configs/alerts.example.yaml configs/alerts.yaml
#   CERBERUS_ALERTS_CONFIG=./configs/alerts.yaml sudo ./build/cerberus
#
# See configs/README.md for the other scenario-oriented examples.

target_history_size: 20

thresholds:
  - id: dns_query_volume
    enabled: true
    metric: dns_queries
    op: gt
    value: 200
    severity: high
    message: DNS queries exceeded threshold

  - id: tcp_connection_volume
    enabled: true
    metric: tcp_connections
    op: gt
    value: 500
    severity: high
    message: TCP connections exceeded threshold

  - id: target_spread
    enabled: true
    metric: unique_targets
    op: gt
    value: 18
    severity: medium
    message: Unique targets exceeded threshold

# Known metrics: dns_queries, tcp_connections, udp_connections, unique_targets,
#                icmp_packets, http_requests, tls_connections, dns_correlated
# Ops: gt, gte, lt, lte, eq | Severity: low, medium, high

baselines:
  rogue_dhcp_server:
    enabled: true
    # Non-empty known_good enables strict mode (anything else alerts).
    known_good: []
  rogue_ipv6_ra_source:
    enabled: true
    known_good: []
  gateway_mac_changed:
    enabled: true

anomaly:
  enabled: true
  window_seconds: 30
  baseline_windows: 20
  score_threshold: 3.5
  max_history: 120
  max_alerts: 100

# Industrial protocol alerts. allowed_sources (IPs or CIDRs) are counted but
# never alerted on; list the SCADA server and engineering workstations.
industrial:
  modbus_write:
    enabled: true
    severity: high
    allowed_sources: []
    realert_seconds: 3600
  modbus_diagnostic:
    enabled: true
    severity: high
    allowed_sources: []
    realert_seconds: 3600
  s7_write:                  # write_var from HMIs is routine; medium by default
    enabled: true
    severity: medium
    allowed_sources: []
    realert_seconds: 3600
  s7_control:                # PLC stop / start
    enabled: true
    severity: high
    allowed_sources: []
    realert_seconds: 3600
  s7_program:                # download, delete block, copy to ROM
    enabled: true
    severity: high
    allowed_sources: []
    realert_seconds: 3600
  dnp3_control:              # select / operate / direct operate, start/stop application
    enabled: true
    severity: high
    allowed_sources: []      # the DNP3 master(s)
    realert_seconds: 3600
  dnp3_diagnostic:           # restarts, disable unsolicited, save configuration
    enabled: true
    severity: high
    allowed_sources: []
    realert_seconds: 3600
  enip_write:                # CIP set attribute / Logix tag writes
    enabled: true
    severity: medium
    allowed_sources: []
    realert_seconds: 3600
  enip_control:              # CIP reset / start / stop
    enabled: true
    severity: high
    allowed_sources: []
    realert_seconds: 3600
  bacnet_write:              # WriteProperty and friends
    enabled: true
    severity: medium
  bacnet_control:            # DeviceCommunicationControl, ReinitializeDevice
    enabled: true
    severity: high
  iec104_control:            # single/double/setpoint commands
    enabled: true
    severity: high
    allowed_sources: []      # the control centre
  iec104_diagnostic:         # reset process
    enabled: true
    severity: high
  opcua_write:
    enabled: true
    severity: medium
  opcua_insecure:            # client opened a channel with SecurityPolicy#None
    enabled: true
    severity: medium
  mqtt_anonymous:            # CONNECT without a username
    enabled: true
    severity: medium
  asset_changed:             # a device reports a different model, firmware or serial
    enabled: true
    severity: high

# Zones and conduits (IEC 62443). Empty by default: nothing is judged until
# zones are defined. Industrial zones are watch-only for policy drop rules
# unless enforce: true. Zones can also be edited on the Zones page; saved
# console changes take precedence over this section.
segmentation:
  zones: []
  #  - {id: enterprise, name: Office LAN, level: 4, cidrs: [10.0.0.0/16]}
  #  - {id: control, name: Line 1 control, level: 1, cidrs: [10.20.0.0/24], industrial: true}
  conduits: []
  #  - {from: enterprise, to: control, ports: [502]}
  no_conduit: {enabled: true, severity: medium, realert_seconds: 3600}
  level_skip: {enabled: true, severity: high, realert_seconds: 3600}

# Industrial flow baseline: learn (client, server, protocol, operation) tuples,
# then alert on new ones. Survives restarts; relearn from the console.
flow_baseline:
  enabled: true
  learning_hours: 168        # one week
  severity: medium
  max_flows: 10000

# Packet capture around alerts (off by default; reads every frame on the
# capture interfaces). See docs/packet-capture.md.
capture:
  enabled: false
  interfaces: []
  snaplen: 1518
  buffer_seconds: 120
  buffer_mb: 64
  on_alert:
    enabled: true
    min_severity: high
    before_seconds: 30
    after_seconds: 10
    min_interval_seconds: 300
  max_files: 50
  max_total_mb: 512

# Optional outbound sinks (disabled by default). Enable and set at least one sink.
notifications:
  enabled: false
  min_severity: low          # low | medium | high
  kinds: []                  # empty = all; or [rule, anomaly, new_device]
  webhook:
    url: ""                  # generic POST of Event JSON
    timeout_seconds: 5
  slack:
    webhook_url: ""          # Slack Incoming Webhook URL
  teams:
    webhook_url: ""          # Teams Workflow / Incoming Webhook URL
    format: adaptive         # adaptive (default) | message_card
  syslog:
    network: udp             # udp | tcp | unix | unixgram
    address: ""              # e.g. 127.0.0.1:514
    tag: cerberus
